<!DOCTYPE html>
<html lang="en">

  <title>Progress Tracker - MD TALHA IBN HAFIZ</title>
  <!-- Chart.js Library -->

  <style>

    body {

    /* Gamify Box */

    .stat-card {

    .stat-card .label {

    .date-box label {

    .date-box input[type="date"] {

    .progress-bg {

    .progress-fill {
      background: #00ff88;

    /* Screen Fit Input Row */

    li {

      justify-content: space-between;
      border: 1px solid #283543;
      font-size: 13px;
    }

    li.done { opacity: 0.5; }
    li.done .task-text { text

    /* Chart Box Screen Fit */

    /* Study Room Styles */

   .mode-select {

    .mode-btn {

    .timer-display {

/* Chat Styling */
    .chat-container {

      display: flex;

    .chat-input-row {

    .chat-input-row input {

      min-width: 0;

    .img-upload-btn {
      background: #283543;

      border-radius: 6px;

    }
    .hidden { display: none !important; }
    .auth-section { text-align: center; padding: 20px 0; }

<body>

  <div class="container">
    <div class="header">
      <h2>GOAL & PROGRESS TRACKER</h2>
      <div class="creator-badge">Created by MD TALHA IBN HAFIZ</div>
    </div>

    <!-- Login Area -->
    <div id="login-box" class="auth-section">
      <p style="color:#9aa5b1; font-size:13px; margin-bottom:15px;">Sign in to access Tracker & Study Room</p>
      <button class="btn-google" onclick="loginWithGoogle()">Sign in with Google</button>
    </div>

    <!-- Main Container -->
    <div id="app-box" class="hidden">
      <!-- Profile Bar -->
      <div class="profile-bar">
        <div class="user-info">
          <span><strong id="user-handle">@user</strong></span>
          <button class="btn-small" onclick="changeUsername()">Edit</button>
        </div>
        <button class="btn-logout" onclick="logout()">Logout</button>
      </div>

      <!-- Navigation Tabs -->
      <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('tracker', this)">TRACKER</button>
        <button class="tab-btn" onclick="switchTab('study', this)">STUDY ROOM</button>
        <button class="tab-btn" onclick="switchTab('chat', this)">CHAT</button>
      </div>

      <!-- Tab 1: Tracker -->
      <div id="tab-tracker" class="tab-content active">
        <div class="gamify-box">
          <div class="stat-card">
            <div class="label">Streak</div>
            <div class="value" id="streakVal">0 Days</div>
          </div>
          <div class="stat-card">
            <div class="label">Badge</div>
            <div class="value" id="badgeVal">Bronze</div>
          </div>
        </div>

        <div class="date-box">
          <label for="taskDate">Select Date:</label>
          <input type="date" id="taskDate" onchange="loadTasks()">
        </div>

        <div class="progress-section">
          <div class="progress-bg">
            <div class="progress-fill" id="progressBar"></div>
          </div>
          <div class="stats-text" id="statsText">0% Completed</div>
        </div>

        <div class="input-wrapper">
          <div class="input-row">
            <select id="taskCategory" class="category-select">
              <option value="Study">Study</option>
              <option value="Workout">Workout</option>
              <option value="Coding">Coding</option>
              <option value="Personal">Personal</option>
            </select>
            <input type="text" id="taskInput" placeholder="Enter new task...">
            <button class="btn-add" onclick="addTask()">Add</button>
          </div>
        </div>

        <ul id="taskList"></ul>

        <div class="chart-box">
          <h4>WEEKLY COMPLETION TREND (%)</h4>
          <div class="canvas-wrapper">
            <canvas id="progressChart"></canvas>
          </div>
        </div>
      </div>
   <!-- Tab 2: Study Room -->
      <div id="tab-study" class="tab-content">
        <div class="study-card">
          <div class="mode-select">
            <button class="mode-btn active" onclick="setTimerMode('stopwatch', this)">Stopwatch</button>
            <button class="mode-btn" onclick="setTimerMode('pomo25', this)">Pomodoro (25m)</button>
          </div>

          <div class="timer-display" id="timerDisplay">00:00:00</div>

          <div class="timer-controls">
            <button class="btn-add" onclick="startTimer()">Start</button>
            <button class="btn-logout" style="color:#ff5252; border-color:#ff5252;" onclick="stopTimer()">Stop & Save</button>
          </div>

          <div class="bgm-controls">
            <span>Rain Sound:</span>
            <input type="checkbox" id="bgmToggle" onchange="toggleBGM(this)">
          </div>
        </div>

        <div class="leaderboard-box">
          <h4>TODAY'S STUDY LEADERBOARD</h4>
          <div id="leaderboardList">
            <div class="leaderboard-item"><span>Loading...</span></div>
          </div>
        </div>
      </div>

      <!-- Tab 3: Community Chat -->
      <div id="tab-chat" class="tab-content">
        <div class="chat-container">
          <div class="chat-messages" id="chatMessages"></div>
          <div class="chat-input-wrapper">
            <div class="chat-input-row">
              <input type="text" id="chatInput" placeholder="Type message... (@username)" onkeypress="handleChatKey(event)">
              <button class="img-upload-btn" onclick="triggerImgUpload()">Image</button>
              <button class="btn-add" onclick="sendChatMessage()">Send</button>
            </div>
            <input type="file" id="imgFileInput" accept="image/*" class="hidden" onchange="uploadImage(event)">
          </div>
        </div>
      </div>

    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, collection, addDoc, query, orderBy, limit, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA7K42WBzWBAKRfWdZPJ2W_i4smbVtN9T0",
      authDomain: "my-project-tracker-3e7ca.firebaseapp.com",
      projectId: "my-project-tracker-3e7ca",
      storageBucket: "my-project-tracker-3e7ca.firebasestorage.app",
      messagingSenderId: "1090393183788",
      appId: "1:1090393183788:web:ec609592f8f2061fdee389",
      measurementId: "G-629WCSP2TT"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;
    let customHandle = "";
    let userTasks = {};
    let myChart = null;
    // Timer vars
    let timerInterval = null;
    let secondsElapsed = 0;
    let isTimerRunning = false;
    let timerMode = 'stopwatch';

    // Rain Audio
    const rainAudio = new Audio('https://www.soundjay.com/nature/rain-01.mp3');
    rainAudio.loop = true;

    const todayStr = new Date().toISOString().split('T')[0];
    document.getElementById('taskDate').value = todayStr;

    window.loginWithGoogle = () => { signInWithPopup(auth, provider).catch(e => alert(e.message)); };
    window.logout = () => { signOut(auth); };

    window.switchTab = (tabName, btn) => {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById('tab-' + tabName).classList.add('active');
      btn.classList.add('active');
      if(tabName === 'study') loadLeaderboard();
      if(tabName === 'chat') loadChatMessages();
    };

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        document.getElementById('login-box').classList.add('hidden');
        document.getElementById('app-box').classList.remove('hidden');
        await fetchUserData();
        loadTasks();
      } else {
        currentUser = null;
        document.getElementById('login-box').classList.remove('hidden');
        document.getElementById('app-box').classList.add('hidden');
      }
    });

    async function fetchUserData() {
      if(!currentUser) return;
      const userRef = doc(db, "users", currentUser.uid);
      const docSnap = await getDoc(userRef);
      if (docSnap.exists()) {
        const data = docSnap.data();
        userTasks = data.tasks || {};
        customHandle = data.handle || currentUser.displayName.replace(/\s+/g, '').toLowerCase();
      } else {
        customHandle = currentUser.displayName.replace(/\s+/g, '').toLowerCase();
        await setDoc(userRef, { handle: customHandle, tasks: {} }, { merge: true });
      }
      document.getElementById('user-handle').innerText = `@${customHandle}`;
    }

    window.changeUsername = async () => {
      const newHandle = prompt("Enter new username (without spaces):", customHandle);
      if(newHandle && newHandle.trim() !== '') {
        customHandle = newHandle.trim().replace(/\s+/g, '').toLowerCase();
        document.getElementById('user-handle').innerText = `@${customHandle}`;
        await setDoc(doc(db, "users", currentUser.uid), { handle: customHandle }, { merge: true });
      }
    };

    async function saveUserData() {
      if(!currentUser) return;
      await setDoc(doc(db, "users", currentUser.uid), { tasks: userTasks }, { merge: true });
    }

    window.loadTasks = () => {
      const selectedDate = document.getElementById('taskDate').value || todayStr;
      const tasks = userTasks[selectedDate] || [];
      const list = document.getElementById('taskList');
      list.innerHTML = '';
let completedCount = 0;
      if (Array.isArray(tasks)) {
        tasks.forEach((task, index) => {
          if(task.completed) completedCount++;
          const li = document.createElement('li');
          if(task.completed) li.classList.add('done');
          const tagClass = `tag-${(task.category || 'personal').toLowerCase()}`;
          li.innerHTML = `
            <div class="task-left">
              <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${index})">
              <span class="tag-badge ${tagClass}">${task.category || 'Personal'}</span>
              <span class="task-text">${task.text}</span>
            </div>
            <button class="btn-del" onclick="deleteTask(${index})">✕</button>
          `;
          list.appendChild(li);
        });
      }

      const total = tasks.length || 0;
      const percent = total === 0 ? 0 : Math.round((completedCount / total) * 100);
      document.getElementById('progressBar').style.width = percent + '%';
      document.getElementById('statsText').innerText = `${percent}% Completed (${completedCount}/${total})`;

      updateStreakAndBadges();
      renderAnalyticsChart();
    };

    window.addTask = async () => {
      const input = document.getElementById('taskInput');
      const category = document.getElementById('taskCategory').value;
      if(input.value.trim() === '') return;
      const selectedDate = document.getElementById('taskDate').value || todayStr;
      if(!userTasks[selectedDate]) userTasks[selectedDate] = [];
      userTasks[selectedDate].push({ text: input.value, category: category, completed: false });
      input.value = '';
      loadTasks();
      await saveUserData();
    };

    window.toggleTask = async (index) => {
      const selectedDate = document.getElementById('taskDate').value || todayStr;
      userTasks[selectedDate][index].completed = !userTasks[selectedDate][index].completed;
      loadTasks();
      await saveUserData();
    };

    window.deleteTask = async (index) => {
      const selectedDate = document.getElementById('taskDate').value || todayStr;
      userTasks[selectedDate].splice(index, 1);
      loadTasks();
      await saveUserData();
    };

    function updateStreakAndBadges() {
      let streak = 0;
      let totalCompletedDays = 0;
      const dates = Object.keys(userTasks).sort();
      dates.forEach(d => {
        const dayTasks = userTasks[d];
        if (dayTasks && dayTasks.length > 0 && dayTasks.every(t => t.completed)) {
          streak++;
          totalCompletedDays++;
        } else if (dayTasks && dayTasks.length > 0) {
          streak = 0;
        }
      });
      document.getElementById('streakVal').innerText = `${streak} Days`;
      let badge = "Bronze";
      if (totalCompletedDays >= 30) badge = "Diamond";
      else if (totalCompletedDays >= 15) badge = "Gold";
      else if (totalCompletedDays >= 7) badge = "Silver";
      document.getElementById('badgeVal').innerText = badge;
    }

    function renderAnalyticsChart() {
      const ctx = document.getElementById('progressChart').getContext('2d');
      const last7Days = [];
      const percents = [];

      for (let i = 6; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        const dateStr = d.toISOString().split('T')[0];
        last7Days.push(dateStr.slice(5));

        const tasks = userTasks[dateStr] || [];
        if (tasks.length === 0) percents.push(0);
        else percents.push(Math.round((tasks.filter(t => t.completed).length / tasks.length) * 100));
      }
if (myChart) myChart.destroy();

      myChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: last7Days,
          datasets: [{
            label: 'Completion %',
            data: percents,
            borderColor: '#00ff88',
            backgroundColor: 'rgba(0, 255, 136, 0.08)',
            fill: true,
            tension: 0.3
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: { min: 0, max: 100, ticks: { color: '#9aa5b1', font: { family: 'Times New Roman', size: 10 } }, grid: { color: '#283543' } },
            x: { ticks: { color: '#9aa5b1', font: { family: 'Times New Roman', size: 10 } }, grid: { color: '#283543' } }
          },
          plugins: { legend: { display: false } }
        }
      });
    }

    // Timer Mode Functions
    window.setTimerMode = (mode, btn) => {
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      timerMode = mode;
      clearInterval(timerInterval);
      isTimerRunning = false;
      secondsElapsed = mode === 'pomo25' ? 1500 : 0;
      updateTimerDisplay();
    };

    function updateTimerDisplay() {
      let hrs = Math.floor(secondsElapsed / 3600).toString().padStart(2, '0');
      let mins = Math.floor((secondsElapsed % 3600) / 60).toString().padStart(2, '0');
      let secs = (secondsElapsed % 60).toString().padStart(2, '0');
      document.getElementById('timerDisplay').innerText = `${hrs}:${mins}:${secs}`;
    }

    window.startTimer = () => {
      if(isTimerRunning) return;
      isTimerRunning = true;
      timerInterval = setInterval(() => {
        if(timerMode === 'pomo25') {
          if(secondsElapsed > 0) secondsElapsed--;
          else { clearInterval(timerInterval); alert("Pomodoro Finished! Take a break."); }
        } else {
          secondsElapsed++;
        }
        updateTimerDisplay();
      }, 1000);
    };

    window.stopTimer = async () => {
      if(!isTimerRunning) return;
      clearInterval(timerInterval);
      isTimerRunning = false;
      const minsStudied = timerMode === 'pomo25' ? 25 : Math.round(secondsElapsed / 60);
      secondsElapsed = 0;
      updateTimerDisplay();

      if(minsStudied > 0 && currentUser) {
        const lbRef = doc(db, "leaderboard", currentUser.uid);
        const snap = await getDoc(lbRef);
        let existing = snap.exists() ? (snap.data().minutes || 0) : 0;
        await setDoc(lbRef, { handle: customHandle, minutes: existing + minsStudied });
        alert(`${minsStudied} mins saved!`);
        loadLeaderboard();
      }
    };

    window.toggleBGM = (cb) => {
      if(cb.checked) rainAudio.play();
      else rainAudio.pause();
    };

    async function loadLeaderboard() {
      const el = document.getElementById('leaderboardList');
      el.innerHTML = '<div class="leaderboard-item"><span>Loading...</span></div>';
      try {
        const q = query(collection(db, "leaderboard"), orderBy("minutes", "desc"), limit(10));
        const snap = await getDocs(q);
        el.innerHTML = '';
        if(snap.empty) { el.innerHTML = '<div class="leaderboard-item"><span>No records yet.</span></div>'; return; }
        snap.forEach(d => {
          const data = d.data();
          el.innerHTML += `<div class="leaderboard-item"><span>@${data.handle || 'user'}</span><strong style="color:#00ff88;">${data.minutes} mins</strong></div>`;
        });
      } catch(e) { el.innerHTML = '<div class="leaderboard-item"><span>Error loading</span></div>'; }
    }
    // Chat Functions with Mention & Image
    window.handleChatKey = (e) => { if(e.key === 'Enter') sendChatMessage(); };
    window.triggerImgUpload = () => { document.getElementById('imgFileInput').click(); };

    window.uploadImage = (event) => {
      const file = event.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = async function(e) {
        await addDoc(collection(db, "chats"), {
          sender: customHandle,
          image: e.target.result,
          text: '',
          timestamp: serverTimestamp()
        });
        loadChatMessages();
      };
      reader.readAsDataURL(file);
    };

    window.sendChatMessage = async () => {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if(text === '' || !currentUser) return;

      await addDoc(collection(db, "chats"), {
        sender: customHandle,
        text: text,
        timestamp: serverTimestamp()
      });
      input.value = '';
      loadChatMessages();
    };

    async function loadChatMessages() {
      const box = document.getElementById('chatMessages');
      box.innerHTML = '<div class="chat-msg">Loading...</div>';
      try {
        const q = query(collection(db, "chats"), orderBy("timestamp", "desc"), limit(25));
        const snap = await getDocs(q);
        box.innerHTML = '';
        const docs = [];
        snap.forEach(d => docs.unshift(d.data()));

        docs.forEach(msg => {
          let textHTML = msg.text || '';
          textHTML = textHTML.replace(/(@\w+)/g, '<span class="mention-text">$1</span>');

          const div = document.createElement('div');
          div.className = 'chat-msg';
          div.innerHTML = `
            <div class="sender"><span>@${msg.sender}</span></div>
            ${textHTML ? `<div>${textHTML}</div>` : ''}
            ${msg.image ? `<img src="${msg.image}">` : ''}
          `;
          box.appendChild(div);
        });
        box.scrollTop = box.scrollHeight;
      } catch(e) { box.innerHTML = '<div class="chat-msg">Error loading chat</div>'; }
    }
  </script>
</body>
</html>
